<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I LOVE U</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #05040b;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* СТАРТОВЫЙ ЭКРАН */

#intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 2s ease, visibility 2s ease;
}

#intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#startButton {
    background: none;
    border: none;
    color: #f5b5e8;
    font-family: Arial, sans-serif;
    font-size: clamp(25px, 5vw, 48px);
    letter-spacing: 3px;
    cursor: pointer;
    text-shadow:
        0 0 5px #ff9de8,
        0 0 15px #ff62d2,
        0 0 35px #e83bbf,
        0 0 65px #b52c9c;
    animation: startGlow 2.5s ease-in-out infinite;
}

@keyframes startGlow {
    0%, 100% { opacity: 0.7; }
    50% {
        opacity: 1;
        text-shadow:
            0 0 8px #fff,
            0 0 20px #ff9de8,
            0 0 45px #ff62d2,
            0 0 75px #e83bbf;
    }
}

/* ОСНОВНАЯ ОТКРЫТКА */

#main {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 2s ease, visibility 2s ease;
}

#main.show {
    opacity: 1;
    visibility: visible;
}

/* ЗВЁЗДЫ */

#stars {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
}

/* БОЛЬШОЕ СЕРДЦЕ */

svg.main-svg {
    position: relative;
    z-index: 1;
    display: block;
    width: min(72vw, 780px);
    height: auto;
    overflow: visible;
}

/* НАДПИСИ */

.love {
    font-family: Arial, sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-anchor: middle;
    dominant-baseline: middle;
    filter: url(#glow);
}

/* ФОТОГРАФИИ */

.photo-card {
    position: fixed;
    z-index: 2;
    width: clamp(100px, 13vw, 165px);
    padding: 7px;
    background: rgba(20, 8, 38, 0.85);
    border: 1px solid #bd70ff;
    border-radius: 5px;
    box-shadow:
        0 0 8px #a044ff,
        0 0 18px rgba(160, 68, 255, 0.8),
        0 0 35px rgba(130, 40, 255, 0.35);
    animation: photoFloat 5s ease-in-out infinite;
}

.photo-card.left {
    top: 50%;
    left: clamp(12px, 4vw, 65px);
    transform: translateY(-50%) rotate(-7deg);
}

.photo-card.right {
    top: 50%;
    right: clamp(12px, 4vw, 65px);
    transform: translateY(-50%) rotate(7deg);
    animation-delay: -2.5s;
}

.photo-card.top {
    top: 5%;
    left: 50%;
    transform: translateX(-50%) rotate(-4deg);
    animation-delay: -1s;
}

.photo-card.bottom {
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%) rotate(4deg);
    animation-delay: -3s;
}

.photo-card img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 2px;
    filter: saturate(0.85) contrast(1.05);
}

.photo-caption {
    text-align: center;
    color: #e8c5ff;
    font-family: Arial, sans-serif;
    font-size: clamp(10px, 1.1vw, 14px);
    letter-spacing: 1px;
    padding: 8px 2px 4px;
    text-shadow:
        0 0 5px #bd70ff,
        0 0 12px #a044ff,
        0 0 22px #8b35ff;
    white-space: nowrap;
}

@keyframes photoFloat {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -7px; }
}

/* ЧЕЛОВЕЧКИ */

.person {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: personFloat 3s ease-in-out infinite;
}

.person.right-person {
    animation-delay: -1.5s;
}

@keyframes personFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
}

.laugh {
    opacity: 0;
    animation: laugh 5s ease-in-out infinite;
}

.laugh.second {
    animation-delay: 2.5s;
}

@keyframes laugh {
    0%, 15%, 100% {
        opacity: 0;
        transform: translateY(5px) scale(0.7);
    }
    20%, 32% {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
    38% {
        opacity: 0;
        transform: translateY(-4px) scale(0.8);
    }
}

.heart-pop {
    transform-box: fill-box;
    transform-origin: center;
    animation: heartPop 3s ease-in-out infinite;
}

@keyframes heartPop {
    0%, 100% {
        opacity: 0.55;
        transform: scale(0.85);
    }
    50% {
        opacity: 1;
        transform: scale(1.15);
    }
}

/* СЕРДЕЧКИ ИЗ ТОЧЕК */

.dotted-heart circle {
    fill: #ff9cde;
    opacity: 0.2;
    filter: url(#pinkGlow);
    animation: dotRun 2.5s ease-in-out infinite;
    animation-delay: var(--delay);
}

@keyframes dotRun {
    0%, 100% {
        opacity: 0.18;
        r: 1.2;
    }
    35% {
        opacity: 1;
        r: 2.5;
    }
    65% {
        opacity: 0.35;
        r: 1.5;
    }
}

/* САКУРА */

.sakura {
    opacity: 0.85;
    filter: url(#pinkGlow);
    animation: sakuraGlow 4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
}

@keyframes sakuraGlow {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
}

/* ДЕКОР В ЧЕТЫРЁХ УГЛАХ */

.corner-decor {
    position: fixed;
    z-index: 1;
    width: clamp(105px, 15vw, 205px);
    height: auto;
    pointer-events: none;
    overflow: visible;
    opacity: .78;
    filter: drop-shadow(0 0 8px rgba(255, 126, 205, .35));
}

.corner-decor.top-left {
    top: 2.5%;
    left: 1.5%;
    transform: rotate(-8deg);
}

.corner-decor.top-right {
    top: 2.5%;
    right: 1.5%;
    transform: rotate(8deg);
}

.corner-decor.bottom-left {
    bottom: 2.5%;
    left: 1.5%;
    transform: rotate(8deg);
}

.corner-decor.bottom-right {
    bottom: 2.5%;
    right: 1.5%;
    transform: rotate(-8deg);
}

.corner-dot {
    fill: #ff9cde;
    opacity: .18;
    filter: drop-shadow(0 0 3px #ff62c8);
    animation: cornerDotRun 2.6s ease-in-out infinite;
    animation-delay: var(--delay);
}

@keyframes cornerDotRun {
    0%, 100% { opacity: .18; }
    35% { opacity: 1; }
    65% { opacity: .35; }
}

.corner-sakura {
    transform-box: fill-box;
    transform-origin: center;
    animation: sakuraGlow 4s ease-in-out infinite;
}

.corner-star {
    fill: #e8d7ff;
    animation: cornerTwinkle 2.8s ease-in-out infinite;
}

.corner-star:nth-of-type(2n) {
    animation-delay: -1.3s;
}

@keyframes cornerTwinkle {
    0%, 100% { opacity: .25; }
    50% { opacity: 1; }
}

/* ТЕЛЕФОНЫ */

@media (max-width: 650px) {
    svg.main-svg {
        width: 82vw;
    }

    .corner-decor.bottom-right {
        bottom: 1%;
    }
}
</style>

<script>

// НАЖАТИЕ НА ТЫК

const intro = document.getElementById("intro");
const main = document.getElementById("main");
const music = document.getElementById("music");

document.getElementById("startButton").addEventListener("click", () => {

    // Показываем открытку
    main.classList.add("show");

    // Убираем стартовый экран
    intro.classList.add("hide");

    // Запускаем музыку именно после нажатия
    music.volume = 0.45;

    music.play().catch(error => {
        console.log("Музыка не запустилась:", error);
    });

});


// ЗВЁЗДНОЕ НЕБО

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;

    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = [];

    for (let i = 0; i < 180; i++) {
        stars.push({
            x: Math.random() * innerWidth,
            y: Math.random() * innerHeight,
            size: Math.random() * 1.4 + 0.3,
            opacity: Math.random() * 0.5 + 0.15,
            speed: Math.random() * 0.015 + 0.003,
            phase: Math.random() * Math.PI * 2
        });
    }
}

window.addEventListener("resize", resize);
resize();

function drawStars() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    const time = Date.now() * 0.001;

    stars.forEach(star => {
        const opacity = star.opacity *
            (0.65 + 0.35 * Math.sin(time * star.speed * 30 + star.phase));

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);

        ctx.fillStyle = `rgba(210, 205, 255, ${opacity})`;
        ctx.fill();
    });

    requestAnimationFrame(drawStars);
}

drawStars();


// БОЛЬШОЕ СЕРДЦЕ

const group = document.getElementById("heart");
const points = [];

function heart(t) {
    return {
        x: 300 + 225 * Math.pow(Math.sin(t), 3),
        y: 260 - (
            90 * Math.cos(t) -
            35 * Math.cos(2*t) -
            15 * Math.cos(3*t) -
            5 * Math.cos(4*t)
        )
    };
}

const steps = 1500;

for (let i = 0; i < steps; i++) {
    points.push(heart(i / steps * Math.PI * 2));
}

let distances = [0];

for (let i = 1; i < points.length; i++) {
    distances.push(
        distances[i-1] +
        Math.hypot(
            points[i].x - points[i-1].x,
            points[i].y - points[i-1].y
        )
    );
}

const totalLength = distances[distances.length - 1];

function getPoint(distance) {
    distance = (distance % totalLength + totalLength) % totalLength;

    let index = 0;

    while (
        index < distances.length - 1 &&
        distances[index + 1] < distance
    ) {
        index++;
    }

    const a = points[index];
    const b = points[(index + 1) % points.length];

    const part =
        (distance - distances[index]) /
        (distances[index + 1] - distances[index] || 1);

    return {
        x: a.x + (b.x - a.x) * part,
        y: a.y + (b.y - a.y) * part
    };
}

const count = 95;
const texts = [];

for (let i = 0; i < count; i++) {
    const text = document.createElementNS(
        "http://www.w3.org/2000/svg", "text"
    );

    text.textContent = "I LOVE U";
    text.setAttribute("class", "love");

    group.appendChild(text);
    texts.push(text);
}

let time = 0;

function animate() {
    time += 0.12;

    texts.forEach((text, i) => {
        const distance =
            (i * totalLength / count + time) % totalLength;

        const p = getPoint(distance);

        const hue = 320 +
            18 * Math.sin(i * 0.12 + time * 0.01);

        text.setAttribute(
            "transform",
            `translate(${p.x}, ${p.y})`
        );

        text.style.fill = `hsl(${hue}, 48%, 77%)`;
    });

    requestAnimationFrame(animate);
}

animate();


// МАЛЕНЬКИЕ СЕРДЕЧКИ ИЗ БЕГУЩИХ ТОЧЕК

const dottedHearts = document.getElementById("dottedHearts");

function createDottedHeart(centerX, centerY, scale) {

    const heartGroup = document.createElementNS(
        "http://www.w3.org/2000/svg", "g"
    );

    heartGroup.setAttribute("class", "dotted-heart");

    const dotCount = 42;

    for (let i = 0; i < dotCount; i++) {

        const t = i / dotCount * Math.PI * 2;

        const x = 16 * Math.pow(Math.sin(t), 3);

        const y = -(
            13 * Math.cos(t) -
            5 * Math.cos(2*t) -
            2 * Math.cos(3*t) -
            Math.cos(4*t)
        );

        const dot = document.createElementNS(
            "http://www.w3.org/2000/svg", "circle"
        );

        dot.setAttribute("cx", centerX + x * scale);
        dot.setAttribute("cy", centerY + y * scale);
        dot.setAttribute("r", 1.7);

        // Каждая точка загорается немного позже предыдущей
        dot.style.setProperty("--delay", `${-i * 0.06}s`);

        heartGroup.appendChild(dot);
    }

    dottedHearts.appendChild(heartGroup);
}

// ДВА СЕРДЕЧКА ПО БОКАМ ОТ ЧЕЛОВЕЧКОВ

createDottedHeart(165, 275, 0.8);
createDottedHeart(435, 275, 0.8);

</script>
